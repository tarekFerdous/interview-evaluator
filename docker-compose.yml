services:
  app:
    build: .
    env_file: .env
    environment:
      PORT: ${PORT:-8000}
      DATABASE_URL: postgresql://evaluator:evaluator@db:5432/evaluator
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: evaluator
      POSTGRES_PASSWORD: evaluator
      POSTGRES_DB: evaluator
    ports:
      # Host port for running the DB tests: TEST_DATABASE_URL=postgresql://evaluator:evaluator@localhost:5433/evaluator_test
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaluator -d evaluator"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
